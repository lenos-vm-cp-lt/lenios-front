<article class="product-card">
  <!-- Contenedor de Imagen y Badge -->
  <div class="card-image-wrapper">
    @if (product.badge) {
      <span class="product-badge" [class.badge-primary]="product.badge === 'Más Vendido' || product.badge === 'Favorito'">
        {{ product.badge }}
      </span>
    }

    @if (product.category) {
      <span class="product-category">
        {{ product.category }}
      </span>
    }

    <img
      [src]="product.imageUrl"
      [alt]="product.name"
      class="product-image"
      loading="lazy"
      decoding="async"
    />

    <div class="image-overlay"></div>
  </div>

  <!-- Contenido de la Tarjeta -->
  <div class="card-body">
    <div class="card-header">
      <h3 class="product-title">{{ product.name }}</h3>
      @if (product.rating) {
        <div class="product-rating" aria-label="Calificación">
          <svg class="star-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
          </svg>
          <span class="rating-value">{{ product.rating }}</span>
        </div>
      }
    </div>

    <p class="product-description">
      {{ product.description }}
    </p>

    <!-- Footer de la tarjeta con precio e información -->
    <div class="card-footer">
      <div class="price-container">
        <span class="price-label">Precio</span>
        <span class="price-amount">{{ product.price | currency:'USD':'symbol':'1.2-2' }}</span>
      </div>

      <button class="action-btn" type="button" [attr.aria-label]="'Ver detalle de ' + product.name">
        <span>Detalles</span>
        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </div>
</article>

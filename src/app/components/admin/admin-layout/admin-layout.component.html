<div class="admin-shell">
  <!-- Navbar Superior -->
  <header class="admin-navbar">
    <div class="navbar-left">
      <button class="mobile-toggle-btn" (click)="toggleSidebar()" aria-label="Abrir menú de navegación">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <div class="brand-logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">Leños Rellenos</span>
          <span class="brand-badge">ADMIN</span>
        </div>
      </div>
    </div>

    <div class="navbar-right">
      <div class="user-profile">
        <div class="avatar">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <div class="user-details">
          <span class="user-name">{{ user.name }}</span>
          <span class="user-role">{{ user.role }}</span>
        </div>
      </div>

      <button class="logout-btn" (click)="logout()" title="Cerrar sesión">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span class="logout-text">Salir</span>
      </button>
    </div>
  </header>

  <div class="admin-body">
    <!-- Overlay móvil -->
    <div class="sidebar-overlay" [class.active]="isSidebarOpen" (click)="closeSidebar()"></div>

    <!-- Sidebar Lateral Navegable -->
    <aside class="admin-sidebar" [class.open]="isSidebarOpen">
      <div class="sidebar-header">
        <span class="sidebar-caption">Navegación Principal</span>
      </div>

      <nav class="sidebar-nav">
        <!-- Enlace a Dashboard -->
        <a routerLink="/admin/dashboard" routerLinkActive="active" (click)="closeSidebar()" class="nav-item">
          <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="9"></rect>
            <rect x="14" y="3" width="7" height="5"></rect>
            <rect x="14" y="12" width="7" height="9"></rect>
            <rect x="3" y="16" width="7" height="5"></rect>
          </svg>
          <span class="nav-label">Dashboard</span>
        </a>

        <!-- Enlace a Productos -->
        <a routerLink="/admin/productos" routerLinkActive="active" (click)="closeSidebar()" class="nav-item">
          <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z">
            </path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
          <span class="nav-label">Productos</span>
        </a>

        <!-- Enlace a Pedidos -->
        <a routerLink="/admin/pedidos" routerLinkActive="active" (click)="closeSidebar()" class="nav-item">
          <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <span class="nav-label">Pedidos</span>
        </a>

        <a routerLink="/admin/solicitudes-arco" routerLinkActive="active" (click)="closeSidebar()" class="nav-item">
          <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          <span class="nav-label">Solicitudes ARCO</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="system-status">
          <span class="status-dot"></span>
          <span class="status-text">Sistema Operativo</span>
        </div>
      </div>
    </aside>

    <!-- Contenedor Principal donde se renderizan las vistas hijas -->
    <main class="admin-main">
      <div class="main-container">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
